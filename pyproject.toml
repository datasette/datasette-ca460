[project]
name = "datasette-ca460"
version = "0.0.1a3"
description = ""
readme = "README.md"
authors = [{name = "Alex Garcia"}]
license = "Apache-2.0"
classifiers=[
    "Framework :: Datasette"
]
requires-python = ">=3.10"
dependencies = [
    "datasette>=1.0a23",
    "llm>=0.28",
    "Pillow>=10.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "llm-gemini>=0.28.2",
    "datasette-llm>=0.1a6",
    "datasette-plugin-router>=0.0.1a2",
    "datasette-vite>=0.0.1a2",
    "pdf-lib-rs-py",
    "click",
    "sqlite-migrate>=0.1b0",
    "sqlite-utils>=3.38",
]

[project.optional-dependencies]
files = ["datasette-files==0.1a3"]

[project.scripts]
datasette-ca460 = "datasette_ca460.cli:ca460_cli"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff>=0.15.0",
]



[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project.urls]
Homepage = "https://github.com/datasette/datasette-ca460"
Changelog = "https://github.com/datasette/datasette-ca460/releases"
Issues = "https://github.com/datasette/datasette-ca460/issues"
CI = "https://github.com/datasette/datasette-ca460/actions"

[project.entry-points.datasette]
ca460 = "datasette_ca460"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
exclude = ["example"]

[tool.ty.rules]
unresolved-import = "ignore"  # optional deps (datasette_sidebar) behind try/except
unresolved-attribute = "ignore"  # pdf_lib C extension + asyncio.TaskGroup false positive
invalid-argument-type = "ignore"  # llm library schema typing is too narrow for extract_ca460 types

[tool.setuptools.package-data]
datasette_ca460 = ["static/**/*", "templates/*", "manifest.json"]

[tool.setuptools.packages.find]
exclude = ["frontend"]
